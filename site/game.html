<style id="polish-css">
/* ===== Polish: єдиний стиль UI ===== */
*{-webkit-tap-highlight-color:transparent}
#btns button,#mmb button,.cco button,#pfs button,#ivh button,#db button,.rc button,#emb button,#ccgo,#mbt,#bag,.eqs,.eqo,#pfx,#pns,#pfc .ob,#cca button,#pwl,#pwr{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
#btns button:active,#mmb button:active,.cco button:active,#pfs button:active,#ivh button:active,#db button:active,.rc button:active,#emb button:active,#ccgo:active,#mbt:active,#bag:active,.eqs:active,.eqo:active,#pns:active,#pfc .ob:active,#cca button:active{transform:scale(.93);filter:brightness(1.15)}
/* Плавні появи панелей (тільки opacity, щоб не ламати позиціонування) */
@keyframes plFade{from{opacity:0}to{opacity:1}}
@keyframes plMsg{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes plDlg{from{opacity:0;transform:translate(-50%,calc(-50% + 14px))}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes plPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes plPulse{0%,100%{box-shadow:0 0 14px rgba(255,200,90,.45),0 4px 10px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 8px rgba(255,170,70,.35),0 0 26px rgba(255,170,70,.9),0 4px 10px rgba(0,0,0,.4)}}
#msg{animation:plMsg .25s ease-out}
#dlg{animation:plDlg .25s ease-out;z-index:16!important}
#pf,#iv,#cc,#em,#mm{animation:plFade .22s ease-out}
#emb{animation:plPop .22s ease-out}
#btns #hit.near{animation:plPulse 1.2s ease-in-out infinite}
/* Атмосфера: легка віньєтка й тепле світло зверху праворуч */
#plfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 88% -8%,rgba(255,228,160,.32),transparent 46%),radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(14,18,44,.34) 100%)}
/* Джойстик і меню істот — якомога нижче */
#joy{left:calc(env(safe-area-inset-left,0px) + 8px)!important;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)!important;z-index:20!important}
#pw2{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)!important;left:calc(env(safe-area-inset-left,0px) + 158px)!important;z-index:15!important}
/* Панелі екіпірування у стилі Palworld: заголовок, іконка + число, нижній рядок */
#eqp{bottom:env(safe-area-inset-bottom,0px)!important;gap:6px}
.eqs{display:grid!important;grid-template-columns:44px 1fr;grid-template-rows:18px 1fr 16px;width:136px!important;height:76px!important;padding:0!important;border:2px solid rgba(235,240,245,.7)!important;border-radius:4px!important;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),linear-gradient(#6a6157,#4a433c)!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.eqs small{grid-column:1/3;grid-row:1;background:#1d232b;color:#eef2f6!important;font-size:11px!important;font-weight:700;text-align:center;line-height:18px;max-width:none!important;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqs .eqi{grid-column:1;grid-row:2;height:auto!important;font-size:28px!important;align-self:center;justify-self:center}
.eqs b{grid-column:2;grid-row:2;align-self:center;justify-self:start;font-size:20px!important;font-weight:700;letter-spacing:.5px;padding-right:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#eqtc{font-size:13px!important}
.eqs u{position:static!important;grid-column:1/3;grid-row:3;justify-self:start;width:100%;padding:0 8px;background:rgba(20,26,34,.55);color:#dfe6ee;font-size:11px!important;line-height:16px;opacity:1!important;text-align:left}
/* HUD: на вузьких екранах слоти екіпірування менші, щоб не лізли на кнопки */
@media (max-width:760px) and (orientation:landscape){
 #eqp{left:350px;gap:4px}
 .eqs{width:112px!important;height:68px!important;grid-template-columns:38px 1fr;grid-template-rows:16px 1fr 14px}
 .eqs small{font-size:10px!important;line-height:16px}
 .eqs .eqi{font-size:24px!important}
 .eqs b{font-size:17px!important}
 #eqtc{font-size:11px!important}
 .eqs u{line-height:14px;font-size:10px!important}
 #btns button{width:60px;height:60px}
 #btns #hit{width:74px;height:74px}
}
@media (prefers-reduced-motion:reduce){#msg,#dlg,#pf,#iv,#cc,#em,#mm,#emb,#btns #hit.near{animation:none!important}}
</style>
